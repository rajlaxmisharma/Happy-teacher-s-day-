<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Day Carnival</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🎪 Teacher's Day Carnival 🎪</h1>

        <p class="subtitle">
            A special celebration for our wonderful teachers
        </p>

        <div class="search-box">
            <h2>🎟️ Your Special Invitation</h2>

            <p>Enter your name to reveal your personalized invitation.</p>

            <input 
                type="text" 
                id="nameInput" 
                placeholder="Enter your name"
            >

            <button onclick="findTeacher()">
                🎠 Reveal My Invitation
            </button>
        </div>

        <div id="invitation" class="invitation"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
